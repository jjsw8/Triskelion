<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Triskelion</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="container">

  <!-- TELA INICIAL -->
  <div id="home">
    <div class="symbol">🌀</div>
    <h1>TRISKELION</h1>
    <p>Quatro mentes, só duas funcionam</p>
    <button onclick="startQuiz()">Começar</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <h2 id="question"></h2>
    <div id="answers"></div>
  </div>

  <!-- RESULTADO -->
  <div id="result" class="hidden">
    <h2>Resultado</h2>
    <div class="result" id="resultText"></div>
    <div class="motto">"Quatro mentes, só duas funcionam"</div>
    <button onclick="restart()">Recomeçar</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
